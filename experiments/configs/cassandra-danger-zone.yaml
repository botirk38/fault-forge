name: cassandra-danger-zone

runs:
  - name: cassandra-nw-cas1-mixed
    system: cassandra
    benchmark: ycsb
    oracle: experiments/oracles/cassandra-batch-throughput.yaml
    issue_id: "CASSANDRA-18120"
    nodes: ["cas1"]
    fault_models: ["nw"]
    magnitudes_ms: [1, 2, 5, 10, 20, 50, 100]
    start_times_s: [0, 10, 30, 60]
    durations_s: [30, 60, 120]
    max_faults_per_trial: 1
    max_trials: 200
    strategy: shuffled
    seed: 42

  - name: cassandra-fs-cas1-mixed
    system: cassandra
    benchmark: ycsb
    oracle: experiments/oracles/cassandra-batch-throughput.yaml
    issue_id: "CASSANDRA-18120"
    nodes: ["cas1"]
    fault_models: ["fs"]
    magnitudes_ms: [1000, 5000, 10000, 50000, 100000]
    start_times_s: [0, 10, 30, 60]
    durations_s: [30, 60, 120]
    max_faults_per_trial: 1
    max_trials: 150
    strategy: shuffled
    seed: 42

  - name: cassandra-nw-cas1-read-repair
    system: cassandra
    benchmark: ycsb
    oracle: experiments/oracles/cassandra-read-timeout.yaml
    issue_id: "CASSANDRA-15442"
    nodes: ["cas1"]
    fault_models: ["nw"]
    magnitudes_ms: [1, 5, 10, 20, 50]
    start_times_s: [10, 30]
    durations_s: [60]
    max_faults_per_trial: 1
    max_trials: 50
    strategy: exhaustive
