name: crdb-danger-zone

runs:
  - name: crdb-nw-roach1-ycsb
    system: crdb
    benchmark: ycsb
    oracle: experiments/oracles/crdb-raft-stepdown.yaml
    issue_id: "CRDB-RAFT-STEPDOWN"
    nodes: ["roach1"]
    fault_models: ["nw"]
    magnitudes_ms: [1, 5, 10, 50, 100, 200, 500, 1000]
    start_times_s: [0, 10, 30, 60]
    durations_s: [30, 60, 120]
    max_faults_per_trial: 1
    max_trials: 200
    strategy: shuffled
    seed: 42

  - name: crdb-fs-roach1-ycsb
    system: crdb
    benchmark: ycsb
    oracle: experiments/oracles/crdb-disk-stall.yaml
    issue_id: "CRDB-DISK-STALL"
    nodes: ["roach1"]
    fault_models: ["fs"]
    magnitudes_ms: [1000, 10000, 50000, 100000, 500000, 1000000]
    start_times_s: [0, 10, 30, 60]
    durations_s: [30, 60, 120]
    max_faults_per_trial: 1
    max_trials: 150
    strategy: shuffled
    seed: 42

  - name: crdb-fs-roach1-sysbench
    system: crdb
    benchmark: sysbench
    oracle: experiments/oracles/crdb-disk-stall.yaml
    issue_id: "CRDB-DISK-STALL"
    nodes: ["roach1"]
    fault_models: ["fs"]
    magnitudes_ms: [10000, 100000, 1000000]
    start_times_s: [10, 30]
    durations_s: [60]
    max_faults_per_trial: 1
    max_trials: 30
    strategy: exhaustive
