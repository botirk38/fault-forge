name: kafka-danger-zone

runs:
  - name: kafka-nw-broker1-openmsg
    system: kafka
    benchmark: openmsg
    oracle: experiments/oracles/kafka-rebalance.yaml
    issue_id: "KAFKA-REBALANCE"
    nodes: ["kafka1"]
    fault_models: ["nw"]
    magnitudes_ms: [1, 5, 10, 50, 100, 200, 500]
    start_times_s: [0, 10, 30, 60]
    durations_s: [30, 60, 120]
    max_faults_per_trial: 1
    max_trials: 200
    strategy: shuffled
    seed: 42

  - name: kafka-fs-broker1-openmsg
    system: kafka
    benchmark: openmsg
    oracle: experiments/oracles/kafka-under-replicated.yaml
    issue_id: "KAFKA-UNDER-REPLICATED"
    nodes: ["kafka1"]
    fault_models: ["fs"]
    magnitudes_ms: [1000, 10000, 50000, 100000, 500000, 1000000]
    start_times_s: [0, 10, 30, 60]
    durations_s: [30, 60, 120]
    max_faults_per_trial: 1
    max_trials: 150
    strategy: shuffled
    seed: 42

  - name: kafka-nw-broker1-perf
    system: kafka
    benchmark: perf_test
    oracle: experiments/oracles/kafka-rebalance.yaml
    issue_id: "KAFKA-REBALANCE"
    nodes: ["kafka1"]
    fault_models: ["nw"]
    magnitudes_ms: [10, 50, 100, 500]
    start_times_s: [10, 30]
    durations_s: [60]
    max_faults_per_trial: 1
    max_trials: 50
    strategy: exhaustive
