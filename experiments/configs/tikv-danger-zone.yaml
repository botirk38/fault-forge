name: tikv-danger-zone

runs:
  - name: tikv-nw-leader-unavail
    system: tikv
    benchmark: sysbench
    oracle: experiments/oracles/tikv-region-unavailable.yaml
    issue_id: "TIKV-REGION-UNAVAIL"
    nodes: ["tikv1"]
    fault_models: ["nw"]
    magnitudes_ms: [1, 5, 10, 50, 100, 200, 500, 1000, 5000]
    start_times_s: [0, 10, 30, 60]
    durations_s: [30, 60, 120]
    max_faults_per_trial: 1
    max_trials: 200
    strategy: shuffled
    seed: 42

  - name: tikv-nw-follower-slow-store
    system: tikv
    benchmark: sysbench
    oracle: experiments/oracles/tikv-slow-store.yaml
    issue_id: "TIKV-SLOW-STORE"
    nodes: ["tikv2"]
    fault_models: ["nw"]
    magnitudes_ms: [10, 50, 100, 200, 500, 1000]
    start_times_s: [0, 10, 30]
    durations_s: [30, 60, 120]
    max_faults_per_trial: 1
    max_trials: 100
    strategy: shuffled
    seed: 42

  - name: tikv-fs-leader-unavail
    system: tikv
    benchmark: sysbench
    oracle: experiments/oracles/tikv-region-unavailable.yaml
    issue_id: "TIKV-REGION-UNAVAIL"
    nodes: ["tikv1"]
    fault_models: ["fs"]
    magnitudes_ms: [1000, 5000, 10000, 50000, 100000, 500000]
    start_times_s: [0, 10, 30, 60]
    durations_s: [30, 60, 120]
    max_faults_per_trial: 1
    max_trials: 200
    strategy: shuffled
    seed: 42
