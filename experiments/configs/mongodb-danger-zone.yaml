name: mongodb-danger-zone

runs:
  - name: mongo-nw-primary-rollback
    system: mongodb
    benchmark: ycsb
    oracle: experiments/oracles/mongo-rollback.yaml
    issue_id: "MONGO-ROLLBACK"
    nodes: ["primary"]
    fault_models: ["nw"]
    magnitudes_ms: [1, 5, 10, 50, 100, 200, 500, 1000, 5000]
    start_times_s: [0, 10, 30, 60]
    durations_s: [30, 60, 120]
    max_faults_per_trial: 1
    max_trials: 200
    strategy: shuffled
    seed: 42

  - name: mongo-nw-secondary-election
    system: mongodb
    benchmark: ycsb
    oracle: experiments/oracles/mongo-election.yaml
    issue_id: "MONGO-ELECTION"
    nodes: ["secondary"]
    fault_models: ["nw"]
    magnitudes_ms: [5, 10, 50, 100, 500, 1000, 5000]
    start_times_s: [0, 10, 30]
    durations_s: [30, 60]
    max_faults_per_trial: 1
    max_trials: 100
    strategy: shuffled
    seed: 42

  - name: mongo-fs-primary-rollback
    system: mongodb
    benchmark: ycsb
    oracle: experiments/oracles/mongo-rollback.yaml
    issue_id: "MONGO-ROLLBACK"
    nodes: ["primary"]
    fault_models: ["fs"]
    magnitudes_ms: [1000, 5000, 10000, 50000, 100000, 500000]
    start_times_s: [0, 10, 30, 60]
    durations_s: [30, 60, 120]
    max_faults_per_trial: 1
    max_trials: 200
    strategy: shuffled
    seed: 42
