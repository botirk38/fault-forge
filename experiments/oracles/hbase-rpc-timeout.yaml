issue:
  id: "HBASE-15018"
  system: "hbase"
  title: "Inconsistent handling of TimeoutException in RPC client under slow faults"
  source: "https://issues.apache.org/jira/browse/HBASE-15018"
  category: "slow-fault"

invalid_if:
  any:
    - file: info
      contains: "docker-compose up failed"

reproduced_if:
  any:
    - file: compose
      regex: "CallTimeoutException"
    - file: compose
      regex: "Call.*expired"
    - file: compose
      regex: "connection.*reset"
    - file: compose
      regex: "RPC.*timeout"
    - file: compose
      regex: "Client session timed out"
    - file: compose
      regex: "Socket error occurred"
