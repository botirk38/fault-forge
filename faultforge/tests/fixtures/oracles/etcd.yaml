issue:
  id: "ETCD-1"
  system: "etcd"
  title: "Fault reproduction — leader change, timeout, or network error under injected faults"
  source: "synthetic"
  category: "availability"

oracle:
  invalid_if:
    any:
      - file: "info"
        contains: "docker-compose up failed"
      - file: "info"
        contains: "cluster failed to set up"
      - file: "info"
        contains: "No such container"

  reproduced_if:
    any:
      - file: "compose"
        regex: "i/o timeout"
      - file: "compose"
        regex: "lost TCP streaming connection"
      - file: "compose"
        regex: "peer became inactive"
      - file: "compose"
        regex: "failed to reach the peer URL"
      - file: "compose"
        regex: "apply request took too long"
      - file: "compose"
        regex: "overloaded network"
      - file: "compose"
        regex: "heartbeat"
      - file: "info"
        contains: "Leader changed: True"
