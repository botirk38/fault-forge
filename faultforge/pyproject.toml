[project]
name = "faultforge"
version = "0.1.0"
description = "Symptom-guided fault reproduction orchestrator for distributed systems"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.3",
    "docker>=7.1.0",
    "pandas>=3.0.3",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tqdm>=4.67.3",
]

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project.scripts]
faultforge = "faultforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/faultforge"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.13",
    "ty>=0.0.37",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.extend-per-file-ignores]
"src/faultforge/systems/*.py" = ["F403", "F405", "E501", "F841", "F541", "UP015", "UP031", "UP024", "E722", "E711", "B007"]
"src/faultforge/configs/*.py" = ["ALL"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src/faultforge/**/*.py"]
exclude = [
    "src/faultforge/configs/**",
    "src/faultforge/systems/**",
]
