name: hbase-danger-zone

runs:
  - name: hbase-nw-regionserver-ycsb
    system: hbase
    benchmark: ycsb
    oracle: experiments/oracles/hbase-rpc-timeout.yaml
    issue_id: "HBASE-15018"
    nodes: ["hbase-regionserver"]
    fault_models: ["nw"]
    magnitudes_ms: [1, 5, 10, 50, 100, 200, 500, 1000]
    start_times_s: [0, 10, 30, 60]
    durations_s: [30, 60, 120]
    max_faults_per_trial: 1
    max_trials: 200
    strategy: shuffled
    seed: 42

  - name: hbase-fs-regionserver-ycsb
    system: hbase
    benchmark: ycsb
    oracle: experiments/oracles/hbase-slow-wal.yaml
    issue_id: "HBASE-26347"
    nodes: ["hbase-regionserver"]
    fault_models: ["fs"]
    magnitudes_ms: [1000, 5000, 10000, 50000, 100000, 500000, 1000000]
    start_times_s: [0, 10, 30, 60]
    durations_s: [30, 60, 120]
    max_faults_per_trial: 1
    max_trials: 200
    strategy: shuffled
    seed: 42

  - name: hbase-nw-regionserver-flaky
    system: hbase
    benchmark: ycsb
    oracle: experiments/oracles/hbase-rpc-timeout.yaml
    issue_id: "HBASE-15018"
    nodes: ["hbase-regionserver"]
    fault_models: ["nw"]
    magnitudes_ms: [1, 5, 10, 20, 40, 70]
    start_times_s: [10, 30]
    durations_s: [60]
    max_faults_per_trial: 1
    max_trials: 50
    strategy: exhaustive
