name: etcd-stale-read
runs:
  - name: nw-sweep
    issue_id: ""
    system: etcd
    benchmark: ycsb
    oracle: oracles/etcd-stale-read.yaml
    strategy: shuffled
    seed: 42
    max_trials: 50
    max_faults_per_trial: 1
    nodes:
      - leader
      - follower
    fault_models:
      - nw
    magnitudes_ms:
      - 10
      - 50
      - 100
      - 250
      - 500
    start_times_s:
      - 0
      - 10
      - 30
    durations_s:
      - 30
      - 60

  - name: fs-sweep
    issue_id: ""
    system: etcd
    benchmark: ycsb
    oracle: oracles/etcd-stale-read.yaml
    strategy: shuffled
    seed: 42
    max_trials: 50
    max_faults_per_trial: 1
    nodes:
      - leader
      - follower
    fault_models:
      - fs
    magnitudes_ms:
      - 10
      - 50
      - 100
      - 250
      - 500
    start_times_s:
      - 0
      - 10
      - 30
    durations_s:
      - 30
      - 60

  - name: baseline
    issue_id: ""
    system: etcd
    benchmark: ycsb
    oracle: oracles/etcd-stale-read.yaml
    strategy: exhaustive
    max_trials: 2
    max_faults_per_trial: 1
    nodes:
      - leader
    fault_models:
      - none
    magnitudes_ms:
      - 10
    start_times_s:
      - 0
    durations_s:
      - 30
