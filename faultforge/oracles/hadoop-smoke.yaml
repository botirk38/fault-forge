issue:
  id: "HADOOP-SMOKE-1"
  system: "hadoop"
  title: "Smoke test — task timeout under network delay"
  source: "synthetic"
  category: "availability"

oracle:
  invalid_if:
    any:
      - file: "info"
        contains: "docker-compose up failed"
      - file: "info"
        contains: "cluster failed to set up"
      - file: "info"
        contains: "No such container"

  reproduced_if:
    any:
      - file: "compose"
        regex: "Failed to place enough replicas"
      - file: "compose"
        regex: "Slow datanode"
      - file: "info"
        contains: "task timeout"
      - file: "info"
        contains: "job failure"
