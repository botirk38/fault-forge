issue:
  id: "KAFKA-1"
  system: "kafka"
  title: "Fault reproduction — producer/consumer timeout, broker unavailable, or errors under injected faults"
  source: "synthetic"
  category: "availability"

oracle:
  invalid_if:
    any:
      - file: "info"
        contains: "docker-compose up failed"
      - file: "info"
        contains: "No such container"
      - file: "info"
        contains: "Warm-up period does not end"

  reproduced_if:
    any:
      - file: "openmsg_driver"
        regex: "err/s\s+[1-9]"
      - file: "openmsg_driver"
        regex: "Error"
      - file: "kafka_producer"
        regex: "timeout"
      - file: "kafka_consumer"
        regex: "timeout"
      - file: "compose"
        regex: "broker unavailable"
      - file: "compose"
        regex: "not enough replicas"
      - file: "compose"
        regex: "disconnect from broker"
      - file: "compose"
        regex: "RequestTimedOut"
