issue:
  id: "ETCD-1"
  system: "etcd"
  title: "Stale read after network partition"
  source: "production"
  category: "consistency"

oracle:
  invalid_if:
    any:
      - file: "info"
        contains: "docker-compose up failed"
      - file: "info"
        contains: "cluster failed to set up"
      - file: "info"
        contains: "No such container"

  reproduced_if:
    all:
      - file: "compose"
        regex: "error"
      - any:
          - file: "compose"
            contains: "StaleRead"
          - file: "compose"
            contains: "read from stale index"
