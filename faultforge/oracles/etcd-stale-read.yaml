issue:
  id: "ETCD-1"
  system: "etcd"
  title: "Stale read after network partition"
  source: "production"
  category: "consistency"
oracle:
  type: "log-symptom"
  verdict: "symptom_present"
  node: "leader"
  pattern:
    log_level: "ERROR"
    exception: "StaleRead"
    exception_msg_contains: "read from stale index"
