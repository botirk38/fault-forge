issue:
  id: "COPILOT-1"
  system: "copilot"
  title: "Fault reproduction — timeout, failure, or error under injected faults"
  source: "synthetic"
  category: "availability"

oracle:
  invalid_if:
    any:
      - file: "info"
        contains: "docker-compose up failed"
      - file: "info"
        contains: "No such container"

  reproduced_if:
    any:
      - file: "info"
        contains: "timeout"
      - file: "info"
        contains: "failed"
      - file: "copilot_misc"
        contains: "error"
      - file: "compose"
        regex: "timeout"
      - file: "compose"
        regex: "failed"
