issue:
  id: "CRDB-1"
  system: "crdb"
  title: "Fault reproduction — transport error, deadline exceeded, or latch contention under injected faults"
  source: "synthetic"
  category: "availability"

oracle:
  invalid_if:
    any:
      - file: "info"
        contains: "docker-compose up failed"
      - file: "info"
        contains: "No such container"

  reproduced_if:
    all:
      - file: "info"
        contains: "Benchmark safely ends"
      - any:
          - file: "runtime"
            regex: "errors?: [1-9]"
          - file: "crdb_log"
            regex: "transport is closing"
          - file: "crdb_log"
            regex: "connection refused"
          - file: "crdb_log"
            regex: "context deadline exceeded"
          - file: "crdb_log"
            regex: "latch"
          - file: "crdb_log"
            regex: "DistSender"
          - file: "crdb_log"
            regex: "retry"
          - file: "crdb_log"
            regex: "error"
