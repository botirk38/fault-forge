issue:
  id: "HADOOP-1"
  system: "hadoop"
  title: "Fault reproduction — failed tasks, replica placement failure, or slow datanode under injected faults"
  source: "synthetic"
  category: "availability"

oracle:
  invalid_if:
    any:
      - file: "info"
        contains: "docker-compose up failed"
      - file: "info"
        contains: "cluster failed to set up"
      - file: "info"
        contains: "No such container"

  reproduced_if:
    any:
      - file: "compose"
        regex: "Failed to place enough replicas"
      - file: "compose"
        regex: "Slow datanode"
      - file: "compose"
        regex: "Failed to connect"
      - file: "compose"
        regex: "Connection refused"
      - file: "info"
        contains: "task timeout"
      - file: "info"
        contains: "job failure"
