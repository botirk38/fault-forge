name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  faultforge-lint:
    name: FaultForge (ruff + ty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check faultforge/

      - name: Ruff format
        run: uv run ruff format --check faultforge/

      - name: Ty check
        run: uv run ty check

  xinda-lint:
    name: Xinda (ruff + ty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --project xinda --frozen

      - name: Ruff check
        run: uv run --project xinda ruff check xinda/src/ xinda/main.py

      - name: Ruff format
        run: uv run --project xinda ruff format --check xinda/src/ xinda/main.py

      - name: Ty check
        run: uv run --project xinda --directory xinda ty check

  anduril-structure:
    name: Anduril (structure check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Anduril structure
        run: |
          test -d anduril/tool || { echo "anduril/tool missing"; exit 1; }
          test -d anduril/systems || { echo "anduril/systems missing"; exit 1; }
          test -d anduril/evaluation || { echo "anduril/evaluation missing"; exit 1; }
          test -f anduril/tool/runtime/pom.xml || { echo "anduril/runtime pom.xml missing"; exit 1; }
          test -f anduril/tool/analyzer/pom.xml || { echo "anduril/analyzer pom.xml missing"; exit 1; }
          echo "Anduril structure OK"
