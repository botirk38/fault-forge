name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── FaultForge (Python orchestrator) ──────────────────────────────
  faultforge-lint:
    name: "FaultForge: Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - run: uv sync

      - name: Ruff check
        run: uv run ruff check faultforge/

      - name: Ruff format check
        run: uv run ruff format --check faultforge/

  faultforge-typecheck:
    name: "FaultForge: Type Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - run: uv sync

      - name: ty check
        run: uv run ty check

  faultforge-test:
    name: "FaultForge: Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - run: uv sync

      - name: Run tests
        run: uv run pytest faultforge/ -v || test $? -eq 5

  # ── Xinda SDK (environmental fault provider) ──────────────────────
  xinda-lint:
    name: "Xinda: Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - run: uv sync

      - name: Ruff check
        run: uv run --project xinda ruff check xinda/

      - name: Ruff format check
        run: uv run --project xinda ruff format --check xinda/src/

  xinda-typecheck:
    name: "Xinda: Type Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - run: uv sync

      - name: ty check
        run: uv run --project xinda --directory xinda ty check

  xinda-test:
    name: "Xinda: Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - run: uv sync

      - name: Run tests
        run: uv run --project xinda pytest xinda/ --ignore=xinda/examples --ignore=xinda/data-analysis -v || test $? -eq 5

  # ── Anduril (Java in-process fault provider) ──────────────────────
  anduril-build:
    name: "Anduril: Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Build Anduril tool
        run: mvn install -DskipTests -B -q
        working-directory: anduril/tool
