[project]
name = "xinda-sdk"
version = "0.1.0"
description = "Automated slow-fault testing pipeline for distributed systems"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.1.0",
    "psutil>=7.2.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.13",
    "ty>=0.0.37",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xinda"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.extend-per-file-ignores]
"main.py" = ["ALL"]
"cleanup.py" = ["ALL"]
"examples/**/*.py" = ["ALL"]
"data-analysis/**/*.py" = ["ALL"]
"xinda/configs/benchmark.py" = ["ALL"]
"xinda/configs/logging.py" = ["ALL"]
"xinda/configs/reslim.py" = ["ALL"]
"xinda/configs/slow_fault.py" = ["ALL"]
"xinda/configs/tool.py" = ["ALL"]
"xinda/systems/*.py" = ["ALL"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["xinda/**/*.py"]
exclude = [
    "xinda/configs/**",
    "xinda/systems/**",
    "examples/**",
    "data-analysis/**",
]
