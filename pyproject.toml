[project]
name = "faultforge"
version = "0.1.0"
description = "Symptom-guided fault reproduction orchestrator for distributed systems"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.3",
    "docker>=7.1.0",
    "pandas>=3.0.3",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tqdm>=4.67.3",
    "xinda",
]

[tool.uv.sources]
xinda = { path = "xinda", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.13",
    "ty>=0.0.37",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.extend-per-file-ignores]
"xinda/**/*.py" = ["ALL"]
"anduril/**/*.py" = ["ALL"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["faultforge/**/*.py"]
exclude = ["xinda/**", "anduril/**"]
